services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-wordpress}
      MARIADB_USER: ${DB_USER:-wordpress}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [internal]

  wordpress:
    image: barbershop-wordpress:php8.2-apache
    build:
      context: .
      dockerfile: docker/wordpress/Dockerfile
      args:
        WORDPRESS_IMAGE: wordpress:php8.2-apache
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WP_PORT:-8080}:80"
    environment: &wordpress-environment
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'DISALLOW_FILE_EDIT', true );
    volumes: &wordpress-volumes
      - wordpress_data:/var/www/html
      - ./theme/persian-barbershop:/var/www/html/wp-content/themes/persian-barbershop:ro
      - ./plugin/barbershop-core:/var/www/html/wp-content/plugins/barbershop-core:ro
    networks: [internal]

  wpcli:
    image: barbershop-wordpress-cli:php8.2
    build:
      context: .
      dockerfile: docker/wordpress/Dockerfile
      args:
        WORDPRESS_IMAGE: wordpress:cli-php8.2
    entrypoint: ["wp"]
    user: "33:33"
    working_dir: /var/www/html
    depends_on:
      database:
        condition: service_healthy
    environment:
      <<: *wordpress-environment
      HOME: /tmp
    volumes: *wordpress-volumes
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  database_data:
  wordpress_data:
