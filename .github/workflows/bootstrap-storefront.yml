name: Bootstrap storefront source

on:
  push:
    branches: [agent/storefront-v2]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    if: ${{ github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'agent/storefront-v2') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/storefront-v2
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct checksum-verified storefront
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/patch.part* > /tmp/storefront.patch
          echo "6431b50b0e0afd33e64cad1b315a41c3e69ccf7bd038b400746c20dd1e4f113f  /tmp/storefront.patch" | sha256sum -c -
          git fetch origin main
          git reset --hard origin/main
          git clean -fdx
          git apply --binary /tmp/storefront.patch
          chmod +x tools/*.sh
      - name: Validate reconstructed project
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/scan-secrets.py
          python3 tools/validate.py
          python3 -m unittest discover -s tests -v
          find theme plugin -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check plugin/barbershop-core/assets/admin.js
          node --check plugin/barbershop-core/assets/frontend.js
          bash -n tools/install.sh tools/deploy.sh tools/build-release.sh
          cp .env.example .env
          sed -i 's/replace-with-a-random-local-password/ci-db-password/' .env
          sed -i 's/replace-with-another-random-local-password/ci-root-password/' .env
          sed -i 's/replace-with-a-strong-admin-password/ci-admin-password/' .env
          docker compose config >/dev/null
          rm -f .env
      - name: Commit finished storefront
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add editable WooCommerce storefront and installer"
          git push --force-with-lease origin HEAD:agent/storefront-v2
